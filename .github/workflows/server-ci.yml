name: Server CI

# Separate CI pipeline for the Express backend (server/ subfolder).
# The root CI workflows cover the Vite/React client only.
#
# Triggers on any change inside server/ to avoid rebuilding the client.

on:
  push:
    branches: [main, develop]
    paths:
      - 'server/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'server/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-typecheck:
    name: TypeScript — server/
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

  server-build:
    name: Build — server/
    runs-on: ubuntu-latest
    needs: server-typecheck

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify entrypoint
        run: |
          [ -f dist/index.js ] || (echo "❌ dist/index.js missing" && exit 1)
          echo "✅ dist/index.js present"
