name: Lint & Type Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint + TypeScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc -b --noEmit

      - name: Generate lint report
        if: always()
        run: |
          npm run lint -- --format=json > lint-report.json 2>&1 || true
          echo "## ESLint + TypeScript" >> $GITHUB_STEP_SUMMARY
          echo "ESLint and type checks completed" >> $GITHUB_STEP_SUMMARY

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint-report.json
          retention-days: 7

  build:
    name: Production Build + PWA Verification
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build production
        run: npm run build

      - name: Verify PWA artifacts
        run: |
          echo "## PWA Artifact Check" >> $GITHUB_STEP_SUMMARY
          for f in dist/index.html dist/sw.js dist/manifest.webmanifest; do
            if [ -f "$f" ]; then
              echo "- $f: present" >> $GITHUB_STEP_SUMMARY
            else
              echo "- MISSING: $f"
              exit 1
            fi
          done

      - name: Bundle size report
        run: |
          echo "## Bundle Size" >> $GITHUB_STEP_SUMMARY
          du -sh dist/assets/*.js 2>/dev/null | sort -rh | head -10 >> $GITHUB_STEP_SUMMARY || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
